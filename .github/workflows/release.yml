name: Test and publish

# One repo, three packages. Every push and pull request tests all of them.
# A tag publishes one package, at the version in its own package.json / pubspec.yaml:
#   ts-v1.0.0       -> @hospify/org-sdk on npm               (needs the NPM_TOKEN secret)
#   rn-v1.0.0       -> @hospify/org-sdk-react-native on npm  (needs the NPM_TOKEN secret)
#   flutter-v1.0.0  -> hospify_org_sdk on pub.dev            (turn on Automated publishing on pub.dev
#                      for this repository, tag pattern flutter-v{{version}}; no secret needed)
# The tag's version must match the package's version.

on:
  push:
    branches: [main]
    tags: ["ts-v*", "rn-v*", "flutter-v*"]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test

  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: typescript
      - run: npm install --no-audit --no-fund && npm test
        working-directory: react-native

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  publish-typescript:
    if: startsWith(github.ref, 'refs/tags/ts-v')
    needs: typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "ts-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm install --no-audit --no-fund && npm run build
      - name: Publish to npm
        run: |
          # npm's errors become annotations, so they show on the run page without opening the log
          npm whoami 2>&1 | sed 's/^/::notice title=npm whoami::/' || true
          set +e
          npm publish --access public > npm.out 2>&1; code=$?
          cat npm.out
          if [ $code -ne 0 ]; then grep -E 'npm (error|ERR)' npm.out | head -8 | sed 's/^/::error title=npm publish::/'; fi
          exit $code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-react-native:
    if: startsWith(github.ref, 'refs/tags/rn-v')
    needs: react-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "rn-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
        working-directory: react-native
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: typescript
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: react-native
      - name: Publish to npm
        working-directory: react-native
        run: |
          # npm's errors become annotations, so they show on the run page without opening the log
          npm whoami 2>&1 | sed 's/^/::notice title=npm whoami::/' || true
          set +e
          npm publish --access public > npm.out 2>&1; code=$?
          cat npm.out
          if [ $code -ne 0 ]; then grep -E 'npm (error|ERR)' npm.out | head -8 | sed 's/^/::error title=npm publish::/'; fi
          exit $code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-flutter:
    if: startsWith(github.ref, 'refs/tags/flutter-v')
    needs: flutter
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write   # pub.dev trusts GitHub's sign-in for this repository
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tag matches pubspec.yaml
        run: test "flutter-v$(grep '^version:' pubspec.yaml | awk '{print $2}')" = "${GITHUB_REF_NAME}"
      - run: flutter pub get
      - run: flutter pub publish --force
